# Dev-only experiments: recall cost of the scalable cold path. Never touches test or held-out instances.
name: experiments
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults: { run: { shell: bash } }
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with: { path: .cache, key: "ch-cache-exp-${{ github.run_id }}", restore-keys: "ch-cache-exp-" }
      - run: ch experiment corpus/instances_swebench.parquet corpus/instances_harvested.parquet --limit 15
      - name: commit dev experiment results
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results/dev_experiments*
          git diff --cached --quiet || (git commit -m "experiments: dev-only results for the scalable cold path" && git push)
