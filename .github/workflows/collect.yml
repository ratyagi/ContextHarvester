# The collector: a scheduled job that mines `Fixes #N` links and commits the instance table.
name: collect
on:
  schedule: [{ cron: "17 5 1 * *" }]   # monthly
  workflow_dispatch:
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: ch harvest --repos-csv corpus/repos.csv
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: ch swebench
      - name: commit instance tables
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add corpus/instances_*.parquet
          git diff --cached --quiet || (git commit -m "collect: refresh instance tables" && git push)
