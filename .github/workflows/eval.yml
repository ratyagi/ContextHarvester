# Runs the full evaluation on public repos and commits Parquet results + results page data.
# Run the collect and tune workflows first (they commit the instance tables, split.json and tuned_params.json).
name: eval
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with: { path: .cache, key: "ch-cache-${{ github.run_id }}", restore-keys: "ch-cache-" }
      - run: ch eval corpus/instances_swebench.parquet --out results/swebench --web-data web/data/swebench
        env: { GITHUB_TOKEN: "${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" }
      - run: ch eval corpus/instances_harvested.parquet --out results/harvested --web-data web/data/harvested
        env: { GITHUB_TOKEN: "${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" }
      - run: python scripts/merge_results.py
      - name: commit results
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results web/data README.md
          git diff --cached --quiet || (git commit -m "eval: refresh results" && git push)
